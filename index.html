<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IronLog</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff9800">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="app-icons/app-icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">

  <!-- jsPDF & AutoTable for Client-Side PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <link rel="stylesheet" href="styles.css">
  
</head>
<body>

  <!-- STEP 1: START RIDE FORM -->
  <div id="setup-card" class="card">
    <h2>Start New Ride</h2>
    <p>Target: 1,000 Miles in 24 Hours</p>
    
    <label>Starting City / Location:
      <input type="text" id="start-location" placeholder="e.g. Chicago, IL">
    </label>
    <br><br>
    <label>Starting Odometer Reading:
      <input type="number" id="start-odo" placeholder="e.g. 48100">
    </label>
    <br><br>
    <label>Start Receipt Photo:
      <div class="file-input-wrapper">
        <span class="file-btn" id="start-file-label">📷 SNAP START RECEIPT</span>
        <input type="file" id="start-photo" accept="image/*" capture="environment" onchange="updateFileLabel('start-photo', 'start-file-label')">
      </div>
    </label>
    <br><br>
    <button onclick="startRide()" class="success">LAUNCH RIDE</button>
  </div>

  <!-- STEP 2: ACTIVE DASHBOARD -->
  <div id="dash-card" class="card hidden">
    <div class="timer-display" id="time-remaining">24:00:00</div>
    <div class="stat-row">
      <span>Distance: <b id="total-dist">0</b> mi</span>
      <span>Stops: <b id="stop-count">0</b></span>
    </div>
  </div>

  <!-- STEP 3: LOG STOP FORM -->
  <div id="log-card" class="card hidden">
    <h3>Log Fuel / Corner Stop</h3>
    <label>Receipt Photo:
      <div class="file-input-wrapper">
        <span class="file-btn" id="stop-file-label">📷 SNAP RECEIPT PHOTO</span>
        <input type="file" id="stop-photo" accept="image/*" capture="environment" onchange="updateFileLabel('stop-photo', 'stop-file-label')">
      </div>
    </label>
    <br><br>
    <label>Current Odometer Reading:
      <input type="number" id="stop-odo" placeholder="e.g. 48310" oninput="validateOdometer()">
    </label>
    <div id="odo-warning" class="warning-box"></div>
    <br>
    <label>Location / City (Optional):
      <input type="text" id="stop-location" placeholder="e.g. Des Moines, IA">
    </label>
    <br><br>
    <button id="save-btn" onclick="saveStop()">SAVE STOP</button>
  </div>

  <!-- RIDE LOG LIST -->
  <div id="history-card" class="card hidden">
    <h3>Ride Log (Tap entry to view/edit)</h3>
    <div id="log-list"></div>
    <br>
    <button onclick="toggleSettings()" class="secondary">⚙️ Ride Options & Data</button>

    <div id="settings-area" class="hidden" style="margin-top: 16px; border-top: 1px dashed #444; padding-top: 16px;">
      <p style="color: #ccc; font-size: 0.9rem; margin-top: 0;">Export Logbook Records:</p>
  
      <button onclick="generateIBAPDF()" class="success" style="margin-bottom: 10px;">📄 EXPORT OFFICIAL IBA PDF PACKET</button>
      <button onclick="exportIBACSV()" class="secondary" style="margin-bottom: 16px; border: 1px solid #555; color: #fff;">📊 EXPORT RAW CSV DATA</button>
  
      <p style="color: #888; font-size: 0.85rem; border-top: 1px solid #333; padding-top: 12px;">Danger Zone: Resetting will purge all active ride tracking data from local storage.</p>
      <button onclick="resetRide()" class="danger">RESET ALL DATA</button>
    </div>
  </div>

  <!-- FULL DETAIL REVIEW & EDIT MODAL -->
  <div id="edit-modal" class="modal hidden">
    <div class="card" style="width: 100%; max-width: 450px; margin: auto;">
      <h3>Stop #<span id="edit-index-title"></span> Details</h3>
      <input type="hidden" id="edit-index">
      
      <label>Captured Receipt Photo:</label>
      <img id="edit-photo-preview" class="receipt-preview" src="" alt="Receipt Preview">
      <div class="file-input-wrapper" style="margin-top: 8px;">
        <span class="file-btn" style="padding: 8px; font-size: 0.9rem;">📷 Replace Photo</span>
        <input type="file" id="edit-photo-input" accept="image/*" capture="environment" onchange="handlePhotoReplace()">
      </div>
      <br><br>

      <label>Location / City:
        <input type="text" id="edit-location" placeholder="e.g. Shell - Des Moines, IA">
      </label>
      <br><br>
      <label>Odometer Reading:
        <input type="number" id="edit-odo">
      </label>
      <br><br>

      <div class="flex-row">
        <div>
          <label>Gallons:
            <input type="number" step="0.001" id="edit-gallons" placeholder="e.g. 4.8">
          </label>
        </div>
        <div>
          <label>Total Cost ($):
            <input type="number" step="0.01" id="edit-cost" placeholder="e.g. 18.50">
          </label>
        </div>
      </div>
      <br>

      <label>Notes (Optional):
        <textarea id="edit-notes" placeholder="e.g. Printer broken, clerk signed receipt."></textarea>
      </label>
      <br><br>

      <button onclick="saveEdit()" class="success">SAVE CHANGES</button>
      <br><br>
      <button onclick="closeEditModal()" class="secondary">CANCEL</button>
    </div>
  </div>

<script src="script.js"></script>

</body>
</html>
